<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Spliiit - Split Expenses Effortlessly</title>
    <meta name="description" content="Spliiit - Modern expense splitting app. Split bills with friends and groups easily." />
    <meta name="theme-color" content="#EAE0D2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spliiit" />
    <!-- iOS Safari Smart App Banner — native "Open in the Spliiit app / Get" prompt -->
    <meta name="apple-itunes-app" content="app-id=6761338254" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Web landing (cold visitors) — editorial cream type system -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Boot splash — paints on first parse (before React/bundle) so there is no
         flash on cold launch. The ink iii printed on a warm paper texture
         (splash-paper.webp), held until the app signals ready (auth resolved)
         via window.__hideBootSplash(). -->
    <style id="boot-splash-style">
      html { background: #ebe2d7; }
      #boot-splash{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;
        background:#ebe2d7 url("/splash-paper.webp") center/cover no-repeat;
        opacity:1;transition:opacity .38s ease;}
      #boot-splash.boot-hide{opacity:0;pointer-events:none;}
      #boot-splash .bs-vig{position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(125% 96% at 50% 47%, transparent 64%, rgba(120,96,58,.05) 86%, rgba(96,74,42,.10) 100%);}
      #boot-splash .bs-mark{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:200px;height:200px;}
      @media (prefers-reduced-motion: reduce){ #boot-splash{transition:opacity .12s ease;} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="bs-vig"></div>
      <svg class="bs-mark" viewBox="0 0 32 32" fill="none">
        <g fill="#201c17" stroke="#201c17">
          <circle cx="10" cy="8.8" r="1.5"/><circle cx="16" cy="8.8" r="1.5"/><circle cx="22" cy="8.8" r="1.5"/>
          <path d="M10 13.6V23.8" stroke-width="3" stroke-linecap="round"/>
          <path d="M16 13.6V23.8" stroke-width="3" stroke-linecap="round"/>
          <path d="M22 13.6V23.8" stroke-width="3" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <script>
      // Boot-splash controller. Holds the splash until the app signals ready
      // (window.__hideBootSplash, called from React once auth resolves), with a
      // minimum on-screen time so it never flickers and a hard cap so a slow
      // network can never trap the user on it.
      (function () {
        window.__bootAt = Date.now();
        var MIN = 700, FADE = 420, done = false;
        window.__hideBootSplash = function () {
          if (done) return; done = true;
          var el = document.getElementById("boot-splash");
          if (!el) return;
          var wait = Math.max(0, MIN - (Date.now() - window.__bootAt));
          setTimeout(function () {
            el.classList.add("boot-hide");
            setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, FADE + 60);
          }, wait);
        };
        // Hard-cap fallback: never hold the splash longer than 3s.
        setTimeout(function () { window.__hideBootSplash(); }, 3000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
